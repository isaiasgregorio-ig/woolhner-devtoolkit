about:
  content: |
    # About Woolhner DevToolkit
    Woolhner DevToolkit is a collection of practical, local-first tools for developers, web engineers and IT professionals. It is maintained by [Woolhner](https://woolhner.com).
    Every transformation runs in your browser. There are no accounts, no databases and no analytics. Some tools (for example MAC address lookup) clearly disclose when an external service is used.
    ## License and attribution
    This derivative is distributed under the [GNU GPL-3.0 license](https://www.gnu.org/licenses/gpl-3.0.html). Legal and third-party notices are preserved in `UPSTREAM.md`, `LICENSE` and `package.json`.
    ## Technologies
    Built with Vue 3, TypeScript, Vite, Naive UI, UnoCSS, Pinia and Vue I18n. The static build is designed for Cloudflare Pages; see `DEPLOYMENT.md`.
    ## Found a bug?
    Please report issues in the [product repository](https://github.com/isaiasgregorio-ig/woolhner-devtoolkit/issues/new/choose).
