    title: Conversor de archivos a Base64
    description: Convierte una cadena, un archivo o una imagen a su representación base64.
  list-converter:
    title: Conversor de listas
    description: Esta herramienta procesa datos por columnas y aplica varios cambios (transponer, añadir prefijo y sufijo, invertir la lista, ordenar, pasar a minúsculas y truncar valores) a cada fila.
