about:
  content: |
    # Acerca de Woolhner DevToolkit

    Woolhner DevToolkit es una colección de herramientas prácticas que funcionan
    primero en el navegador, pensadas para desarrolladores, ingenieros web y
    profesionales de TI. Es mantenido por [Woolhner](https://woolhner.com).

    Cada transformación se realiza en tu navegador. No hay cuentas, bases de datos
    ni analítica. Algunas herramientas (por ejemplo, la consulta de direcciones MAC)
    indican claramente cuándo se usa un servicio externo.

    ## Licencia y atribución

    Esta derivación se distribuye bajo la licencia
    [GNU GPL-3.0](https://www.gnu.org/licenses/gpl-3.0.html). Los avisos legales
    y de terceros se conservan en `UPSTREAM.md`, `LICENSE` y `package.json`.

    ## Tecnologías

    Construido con Vue 3, TypeScript, Vite, Naive UI, UnoCSS, Pinia y Vue I18n.
    La compilación estática está diseñada para Cloudflare Pages; consulta
    `DEPLOYMENT.md`.

    ## ¿Encontraste un error?

    Informa de los problemas en el
    [repositorio del producto](https://github.com/isaiasgregorio-ig/woolhner-devtoolkit/issues/new/choose).
