    description: Compara fácilmente el tiempo de ejecución de tareas con este sencillo creador de benchmarks en línea.
  git-memo:
    title: Hoja de trucos de Git
    description: Git es un software de control de versiones descentralizado. Con esta hoja de trucos tendrás a mano los comandos Git más habituales.
  slugify-string:
    title: Convertir a slug
    description: Convierte una cadena en una URL, un nombre de archivo o un identificador seguro.
  encryption:
    title: Cifrar / descifrar texto
    description: Cifra texto en claro y descifra texto cifrado con algoritmos como AES, TripleDES, Rabbit o RC4.
  random-port-generator:
    title: Generador de puertos aleatorios
    description: Genera números de puerto aleatorios fuera del rango de puertos «conocidos» (0-1023).
  yaml-prettify:
    title: Embellecedor y formateador de YAML
    description: Embellece tu cadena YAML en un formato legible y cómodo.
